<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archipel">
<meta name="theme-color" content="#1479c4">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>L'Archipel des Nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bangers&display=swap">
<style>
/* Layout : appli mobile une colonne — en-tête papier, carte marine qui défile (route d'îles), barre d'onglets ; les jeux s'ouvrent en plein écran par-dessus. Univers manga pirate, traits d'encre épais et ombres « bande dessinée ». Un seul thème assumé. */
:root{
  --sea:#1479c4; --sea-deep:#0b4a80; --foam:#cdeeff;
  --paper:#fff8e8; --parch:#f2d9a6; --sand:#f7dd96;
  --ink:#1d1a2b; --ink-soft:#4a4560;
  --straw:#ffcb2f; --red:#e8433a; --green:#2aa860; --violet:#7b4fd6;
  --f-display:'Bangers','Impact','Arial Black',system-ui,sans-serif;
  --f-body:'Baloo 2','Nunito','Trebuchet MS',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--straw);outline-offset:2px}
.disp{font-family:var(--f-display);letter-spacing:.04em;font-weight:400}

.waves{background-color:var(--sea);background-image:radial-gradient(circle at 50% 100%,transparent 9px,rgba(255,255,255,.16) 10px,rgba(255,255,255,.16) 11px,transparent 12px);background-size:44px 20px}

#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border-inline:3px solid var(--ink)}

/* En-tête */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--paper);border-bottom:3px solid var(--ink)}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.who-txt{min-width:0}
.who-name{font-family:var(--f-display);font-size:22px;letter-spacing:.05em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-rank{font-size:13px;color:var(--ink-soft);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--straw);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px 0;font-family:var(--f-display);font-size:19px;letter-spacing:.04em;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{width:42px;height:42px;flex:none;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);font-size:20px;display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hourglass{height:6px;background:rgba(29,26,43,.12);border-radius:3px;overflow:hidden;margin-top:3px;width:84px}
.hourglass i{display:block;height:100%;background:var(--green);width:0;transition:width 1s linear}

main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}

/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:3px solid var(--ink)}
.tab{border:0;background:none;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:800;font-size:13px;color:var(--ink-soft)}
.tab b{font-size:22px;line-height:1.2}
.tab[aria-selected="true"]{color:var(--ink);background:var(--straw)}

/* Carte */
.map{padding:14px 16px 28px;position:relative;min-height:100%}
.map-head{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.map-head h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.05em;line-height:1}
.map-head p{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
.route{position:relative;margin-top:10px}
.route-svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.isl{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 0;text-align:left}
.isl.r{flex-direction:row-reverse;text-align:right}
.isl-blob{flex:none;width:96px;height:88px;border-radius:52% 48% 46% 54%/58% 52% 48% 42%;background:var(--sand);border:3.5px solid var(--ink);box-shadow:0 0 0 7px rgba(205,238,255,.55),0 6px 0 7px rgba(11,74,128,.45);display:grid;place-items:center;position:relative}
.isl-blob::after{content:"";position:absolute;inset:auto 10% 8% 10%;height:28%;border-radius:50%;background:var(--ic,#2aa860);opacity:.35}
.isl-ico{font-size:42px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.isl-txt{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px 7px;box-shadow:0 4px 0 var(--ink);min-width:0;max-width:62%}
.isl-name{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:.05em;line-height:1.05}
.isl-notion{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:700;line-height:1.2}
.pips{display:flex;gap:3px;margin-top:4px}
.isl.r .pips{justify-content:flex-end}
.pip{width:15px;height:8px;border-radius:3px;border:1.5px solid var(--ink);background:#fff}
.pip.on{background:var(--ic)}
.isl:active .isl-blob{transform:scale(.96)}
.mission{position:absolute;top:2px;font-family:var(--f-display);letter-spacing:.05em;font-size:15px;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:1px 9px 0;transform:rotate(-6deg);z-index:2;white-space:nowrap}
.isl:not(.r) .mission{left:44px}
.isl.r .mission{right:44px;transform:rotate(6deg)}
.isl.soon .isl-blob{background:#c9d6df;filter:saturate(.3)}
.isl.soon .isl-blob::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),rgba(255,255,255,0));z-index:2}
.isl.soon .isl-txt{background:#e9eef2;border-style:dashed}
.tag-soon{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 6px;margin-top:3px}
.boat{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}

/* Pages papier */
.page{padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px}
.panel h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;letter-spacing:.05em;font-size:26px;line-height:1.05;text-wrap:balance}
.panel h3{margin:0 0 6px;font-size:17px;font-weight:800}
.muted{color:var(--ink-soft);font-size:14px;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--straw);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);font-family:var(--f-display);letter-spacing:.05em;font-size:24px;padding:9px 18px 6px;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn[disabled]{background:#d6dcd8;color:#7d8a83;box-shadow:0 5px 0 rgba(29,26,43,.35);border-color:rgba(29,26,43,.5);pointer-events:none}
.btn.small{font-size:18px;min-height:42px;padding:6px 12px 4px}

/* Équipage */
.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mon{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 6px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.mon .e{font-size:40px;line-height:1.15;display:block}
.mon .n{font-weight:800;font-size:13.5px;line-height:1.15;display:block;min-height:2.3em}
.mon .r{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-radius:6px;padding:1px 6px;display:inline-block;margin-top:2px;background:#e6e1d4}
.mon .r.rare{background:#cfe5ff}
.mon .r.légendaire{background:var(--straw)}
.mon.lock{background:#dfe8ef;box-shadow:0 4px 0 rgba(29,26,43,.35);border-style:dashed}
.mon.lock .e{filter:brightness(0);opacity:.22}

/* Avis de recherche */
.poster{background:var(--parch);border:4px solid var(--ink);border-radius:6px;padding:16px 18px 18px;text-align:center;box-shadow:0 6px 0 var(--ink),inset 0 0 0 6px rgba(140,90,30,.18);position:relative;max-width:360px;margin:0 auto;width:100%}
.poster .wanted{font-family:var(--f-display);font-size:clamp(40px,12vw,54px);letter-spacing:.06em;line-height:.95;margin:0}
.poster .sub{font-weight:800;letter-spacing:.2em;font-size:13px;text-transform:uppercase}
.poster .photo{margin:10px auto;width:min(200px,70%);aspect-ratio:1;max-width:100%;background:#fdf1d6;border:3px solid var(--ink);display:grid;place-items:center}
.poster .pname{font-family:var(--f-display);font-size:32px;letter-spacing:.06em;margin:0;line-height:1}
.poster .bounty{font-family:var(--f-display);font-size:30px;letter-spacing:.04em;margin:6px 0 0;font-variant-numeric:tabular-nums}
.poster .title{display:inline-block;margin-top:6px;background:var(--ink);color:var(--parch);font-weight:800;border-radius:6px;padding:2px 10px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}

/* Jeux plein écran */
#layer:empty{display:none}
.game{position:fixed;inset:0;max-width:560px;margin:0 auto;z-index:40;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.g-top{display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dot{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--ink);background:rgba(255,255,255,.55)}
.dot.ok{background:var(--green)}.dot.ko{background:var(--red)}.dot.cur{background:var(--straw);transform:scale(1.2)}
.lvl-chip{font-family:var(--f-display);letter-spacing:.05em;font-size:18px;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px 0;white-space:nowrap}
.g-name{font-family:var(--f-display);color:#fff;font-size:24px;letter-spacing:.06em;text-align:center;line-height:1;-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 3px 0 var(--ink)}
.g-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.scene{flex:1;min-height:80px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}
.ask{font-weight:800;font-size:16px;line-height:1.2;color:var(--ink-soft);text-wrap:balance}
.prompt{font-family:var(--f-display);font-size:clamp(32px,10vw,46px);letter-spacing:.04em;line-height:1.1;font-variant-numeric:tabular-nums;text-wrap:balance}
.prompt.mid{font-size:clamp(24px,7vw,32px)}
.words{font-family:var(--f-body);font-weight:800;font-size:clamp(19px,5.4vw,24px);letter-spacing:0;color:var(--violet);display:inline-block;line-height:1.2;word-break:break-word}
.slot{display:inline-block;min-width:1.8em;padding:0 .15em;border-bottom:4px dashed var(--red);color:var(--red);text-align:center;line-height:1}
.slot:empty::before{content:"?";opacity:.3}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:52px;font-family:var(--f-display);font-size:30px;letter-spacing:0;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:3px 0 0}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.ok{background:var(--green);color:#fff}
.key.del{background:#f1e6cf}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{min-height:72px;font-family:var(--f-display);font-size:clamp(26px,8vw,34px);letter-spacing:.03em;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:6px 4px 2px;font-variant-numeric:tabular-nums}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em;font-variant-numeric:tabular-nums}
.frac b{font-weight:inherit;padding:0 .12em}
.frac b:first-child{border-bottom:.09em solid currentColor;padding-bottom:.05em}

/* Canon */
.sea-scene{width:100%;flex:1;position:relative;min-height:70px}
.ship{position:absolute;bottom:16%;font-size:48px;line-height:1;z-index:1}
.ship.me{left:6%}
.ship.foe{right:6%;transform:scaleX(-1)}
.ship.foe.hit{animation:hit .6s}
@keyframes hit{30%{transform:scaleX(-1) rotate(-14deg) translateY(4px)}}
.ball{position:absolute;left:18%;bottom:40%;width:16px;height:16px;border-radius:50%;background:var(--ink);opacity:0}
.ball.fly{animation:fly .55s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0)}50%{transform:translate(32vw,-40px)}100%{opacity:1;transform:translate(min(62vw,330px),0)}}
.sea-line{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--sea);opacity:.85;border-top:3px solid var(--ink)}

/* But de foot */
.pitch{width:100%;flex:1;position:relative;background:#45b36b;border-radius:12px;border:3px solid var(--ink);overflow:hidden;min-height:150px}
.pitch::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40%;height:70%;border:3px solid rgba(255,255,255,.7);border-radius:50%}
.goal{position:absolute;left:6%;right:6%;top:10%;height:62%;border:5px solid #fff;border-bottom:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,transparent 2px 14px),repeating-linear-gradient(0deg,rgba(255,255,255,.28) 0 2px,transparent 2px 14px);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:6px;padding:6px}
.zone{height:100%;max-height:94px;font-family:var(--f-display);font-size:clamp(26px,8vw,36px);background:rgba(255,248,232,.92);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums;padding:4px 2px 0}
.zone:nth-child(2){align-self:start;height:70%}
.keeper{position:absolute;left:50%;top:44%;font-size:40px;transform:translateX(-50%);transition:transform .35s ease-out;pointer-events:none}
.ballf{position:absolute;left:50%;bottom:6%;font-size:30px;transform:translateX(-50%);transition:all .4s ease-out;pointer-events:none}

/* Mine */
.mine-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;flex:1;min-height:0}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;background:#efe3c8;border:2.5px solid var(--ink);border-radius:12px;padding:6px 3px;min-width:0}
.mcol-h{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.pile{flex:1;min-height:56px;width:100%;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:2px;overflow:hidden}
.cnt{font-family:var(--f-display);font-size:24px;line-height:1}
.pm{display:flex;gap:4px;width:100%}
.pm button{flex:1;height:40px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-family:var(--f-display);font-size:24px;box-shadow:0 3px 0 var(--ink);padding:2px 0 0}
.pm button.plus{background:var(--straw)}
.blk{display:block;border:1.5px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.22),inset 2px 2px 0 rgba(255,255,255,.45)}
.b-m{width:26px;height:26px;background:#f2b51c;background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25% 50%,rgba(255,255,255,.25) 50% 75%,transparent 75%);background-size:8px 8px}
.b-c{width:22px;height:22px;background:#4fd6d0;background-image:linear-gradient(rgba(29,26,43,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(29,26,43,.18) 1px,transparent 1px);background-size:4.4px 4.4px}
.b-d{width:7px;height:28px;background:#3cc46a;background-image:linear-gradient(rgba(29,26,43,.25) 1px,transparent 1px);background-size:7px 2.8px}
.b-u{width:9px;height:9px;background:#9a9aa6}
.mine-total{font-weight:800;font-size:15px;color:var(--ink-soft)}

/* Ligne graduée */
.line-svg{width:100%;max-width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.line-svg text{font-family:var(--f-body);font-weight:800;fill:var(--ink)}

/* Marché */
.tagp{display:inline-flex;flex-direction:column;align-items:center;background:var(--straw);border:3px solid var(--ink);border-radius:10px 10px 10px 26px;padding:6px 16px 4px;box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg)}
.tagp b{font-family:var(--f-display);font-size:34px;letter-spacing:.03em;line-height:1;font-weight:400}
.tray{width:100%;min-height:58px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;border:2.5px dashed var(--ink-soft);border-radius:12px;padding:6px;background:#fdf3dd}
.tray:empty::before{content:"Touche les pièces et les billets pour payer";color:var(--ink-soft);font-size:14px;font-weight:700}
.purse{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.coin,.bill{display:inline-grid;place-items:center;border:2.5px solid var(--ink);font-weight:800;line-height:1;padding:0;box-shadow:0 3px 0 var(--ink)}
.coin{width:52px;height:52px;border-radius:50%;font-size:15px}
.coin.cu{background:#d07a3e;color:#fff}
.coin.au{background:#e9bd45}
.coin.bi{background:radial-gradient(circle,#e9bd45 0 52%,#c9ccd3 54%)}
.bill{width:62px;height:40px;border-radius:6px;font-size:16px}
.bill.b5{background:#b9c7b7}.bill.b10{background:#ee9a86}.bill.b20{background:#8fb1e6}
.tray .coin{width:38px;height:38px;font-size:12px;box-shadow:none}
.tray .bill{width:48px;height:30px;font-size:13px;box-shadow:none}

/* Cuisine */
.pizza{width:min(190px,52vw);max-width:100%;height:auto;touch-action:manipulation}
.slice{fill:#ffd66b;stroke:var(--ink);stroke-width:3;cursor:pointer;transition:fill .15s}
.slice.on{fill:var(--red)}
.fbars{display:flex;flex-direction:column;gap:12px;width:100%}
.fbar{display:flex;align-items:center;gap:10px}
.fbar .cells{flex:1;display:flex;height:30px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.fbar .cells i{flex:1;border-right:2px solid var(--ink)}
.fbar .cells i:last-child{border-right:0}
.fbar .cells i.on{background:var(--straw)}
.fbar .lab{font-family:var(--f-display);font-size:28px;width:2.2em;text-align:center}

/* Effets */
.burst{position:fixed;left:50%;top:36%;z-index:70;transform:translate(-50%,-50%) rotate(-7deg);background:var(--straw);padding:46px 58px;clip-path:polygon(50% 0%,60% 17%,80% 5%,78% 27%,100% 28%,85% 46%,100% 64%,78% 70%,82% 95%,61% 82%,50% 100%,39% 82%,18% 95%,22% 70%,0% 64%,15% 46%,0% 28%,22% 27%,20% 5%,40% 17%);text-align:center;pointer-events:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.burst .w{display:block;font-family:var(--f-display);font-size:clamp(38px,12vw,58px);letter-spacing:.04em;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:3px 4px 0 var(--ink);line-height:1;white-space:nowrap}
.burst .g{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);margin-top:4px}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-30deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(-7deg)}}

/* ---------- Générateurs de questions (niveaux 1 à 5) ---------- */
function opts(x, extra = [], fmtFn = fmt) {

function genCanon(l) {
  const tabs = l === 1 ? [2, 5, 10] : l === 2 ? [2, 3, 4, 5, 10] : [2, 3, 4, 5, 6, 7, 8, 9];

function genFoot(l) {

    else { const a = rnd(41, 99), b = rnd(12, a - 15); ans = a - b; log = `${a} − ${b}`; const tb = b - b % 10; explain = `On enlève ${tb} puis ${b % 10} : ${a} − ${tb} = ${a - tb}, puis ${a - tb} − ${b % 10} = ${ans}.`; extra = [ans + 10, ans - 10]; q = `${log} = ?`; }
  }
  return { kind: 'goal', ask: 'Tire dans la bonne case !', prompt: q, answer: ans, answerText: fmt(ans), explain, log, choices: opts(ans, extra) };
}

function genMine(l) {
  if (l <= 3) {
    const n = l === 1 ? rnd(101, 999) : rnd(1001, 9999);
    return { kind: 'mine', target: n, showTotal: l === 1, answer: n, answerText: fmt(n),
      prompt: l === 3 ? `<span class="words">${words(n)}</span>` : fmt(n),
      ask: l === 3 ? 'Construis ce nombre avec les blocs :' : 'Construis ce nombre avec les blocs :',
      log: l === 3 ? words(n) : fmt(n), explain: `${fmt(n)}, c’est ${decomp(n)}.` };
  }
  if (l === 4) {
    let m, c, d, u, n;
    do { m = rnd(0, 7); c = rnd(0, 9); d = rnd(0, 9); u = rnd(0, 9); const w = rnd(1, 3); if (w === 1) c = rnd(10, 19); else if (w === 2) d = rnd(10, 19); else u = rnd(10, 19); n = m * 1000 + c * 100 + d * 10 + u; } while (n > 9999 || n < 100);
    return { kind: 'mineRead', counts: [m, c, d, u], answer: n, answerText: fmt(n), ask: 'Quel nombre forment ces blocs ?', prompt: SLOT,
      log: `${m} milliers, ${c} centaines, ${d} dizaines, ${u} unités`,
      explain: `${m} × 1 000 + ${c} × 100 + ${d} × 10 + ${u} = ${fmt(n)}. Rappel : 10 unités = 1 dizaine, 10 dizaines = 1 centaine, 10 centaines = 1 millier.` };
  }
  const n = rnd(1001, 9999), [m, c, d, u] = digits(n);
  const f = pick(['mult', 'add', 'diz', 'mix']);
  const txt = f === 'mult' ? `(${m} × 1 000) + (${c} × 100) + (${d} × 10) + ${u}`
    : f === 'add' ? [m * 1000, c * 100, d * 10, u].filter(Boolean).map(fmt).join(' + ')
    : f === 'diz' ? `${fmt(Math.floor(n / 10))} dizaines et ${pl(u, 'unité')}`
    : `${pl(d, 'dizaine')}, ${pl(m * 10 + c, 'centaine')} et ${pl(u, 'unité')}`;
  return { kind: 'keypad', scene: 'mine', ask: 'Écris ce nombre en chiffres :', prompt: `<span class="words">${txt}</span><br>${SLOT}`, promptClass: 'mid',
    answer: n, answerText: fmt(n), log: txt, explain: `${txt} = ${fmt(n)}, c’est-à-dire ${decomp(n)}.` };
}

function genChasse(l) {
  const cfg = [null, { s: 0, st: 10 }, { s: 0, st: 100 }, { s: rnd(1, 98) * 100, st: 10 }, { s: 0, st: 1000 }, { s: rnd(100, 999) * 10, st: 1 }][l];
  const k = rnd(1, 9), v = cfg.s + k * cfg.st, mon = pick(CREW).e;
  const explain = `Chaque graduation avance de ${fmt(cfg.st)}. ${fmt(cfg.s)} + ${k} × ${fmt(cfg.st)} = ${fmt(v)}.`;
  const base = { start: cfg.s, step: cfg.st, k, mon, mid: l <= 2, answer: v, answerText: fmt(v), explain };
  if (Math.random() < .55) return { ...base, kind: 'line', ask: `${mon} se cache à ce nombre. Touche sa graduation puis valide !`, prompt: fmt(v), log: `placer ${fmt(v)} (de ${fmt(cfg.s)} en ${fmt(cfg.st)})` };
  const wrong = shuffle([v + cfg.st, v - cfg.st, v + 2 * cfg.st, v - 2 * cfg.st, v + cfg.st / 10 * (cfg.st >= 10 ? 1 : 0)]).filter(x => x >= cfg.s && x <= cfg.s + 10 * cfg.st && x !== v && Number.isInteger(x));
  return { ...base, kind: 'lineRead', ask: 'Quel nombre indique la flèche ?', prompt: '', log: `lire la flèche (de ${fmt(cfg.s)} en ${fmt(cfg.st)})`,
    choices: shuffle([v, ...[...new Set(wrong)].slice(0, 2)]).map(x => ({ v: x, html: fmt(x) })) };
}

const ITEMS = ['une corde', 'un poisson', 'une boussole', 'une longue-vue', 'une carte au trésor', 'un tonneau de jus', 'des bananes', 'une voile neuve', 'un drapeau pirate', 'un sac de riz'];
function genMarche(l) {
  const denoms = l === 1 ? [1000, 500, 200, 100] : l === 2 ? [1000, 500, 200, 100, 50, 20, 10] : [2000, 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];
  let target, ask, prompt, explain, log;
  const greedy = c => { const out = []; for (const d of [2000, 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1]) while (c >= d) { out.push(coinLabel(d)); c -= d; } return out.join(' + '); };
  if (l <= 3) {
    target = l === 1 ? rnd(2, 19) * 100 : l === 2 ? rnd(1, 9) * 100 + rnd(1, 9) * 10 : rnd(105, 999);
    const it = pick(ITEMS); ask = `Le cuistot achète ${it}. Paye la somme exacte :`; prompt = fmtE(target); log = `payer ${fmtE(target)}`;
    explain = `Il fallait ${fmtE(target)}, par exemple : ${greedy(target)}.`;
  } else if (l === 4) {
    const paid = pick([500, 1000]), price = rnd(paid === 500 ? 105 : 510, paid - 5);
    target = paid - price; const it = pick(ITEMS);
    ask = `Un client achète ${it} à ${fmtE(price)} et paye avec un billet de ${fmtE(paid)}. Rends-lui la monnaie :`; prompt = '?'; log = `rendre sur ${fmtE(paid)} pour ${fmtE(price)}`;
    const up = Math.ceil(price / 100) * 100;
    explain = `On complète : de ${fmtE(price)} à ${fmtE(up)} il manque ${fmtE(up - price)}, puis de ${fmtE(up)} à ${fmtE(paid)} il manque ${fmtE(paid - up)}. On rend ${fmtE(target)}.`.replace(/de (\S+ €) à \1 il manque 0 €, puis /, '');
  } else {
    const a = rnd(105, 899), b = rnd(105, 899); target = a + b; const [i1, i2] = shuffle(ITEMS);
    ask = `Le cuistot achète ${i1} à ${fmtE(a)} et ${i2} à ${fmtE(b)}. Paye le total exact :`; prompt = '?'; log = `payer ${fmtE(a)} + ${fmtE(b)}`;
    explain = `${fmtE(a)} + ${fmtE(b)} = ${fmtE(target)}, par exemple : ${greedy(target)}.`;
  }
  return { kind: 'money', denoms, target, showTotal: l <= 2, ask, prompt, answer: target, answerText: fmtE(target), explain, log };
}

function genCuisine(l) {
  if (l <= 3) {
    let d, n, parts;
    if (l === 1) { d = pick([2, 4]); n = rnd(1, d - 1); parts = d; }
    else if (l === 2) { d = rnd(3, 12); n = rnd(1, d - 1); parts = d; }
    else { d = pick([2, 3, 4, 5, 6]); n = rnd(1, d - 1); parts = d * rnd(2, Math.floor(12 / d)); }
    const need = n * parts / d, food = pick(['la pizza', 'la tarte', 'le gâteau']);
    return { kind: 'pizza', parts, n, d, ask: `Le cuistot a coupé ${food} en ${parts} parts égales. Colore :`, prompt: frac(n, d), answer: `${n}/${d}`, answerText: `${need} parts sur ${parts}`,
      log: `colorer ${n}/${d} (coupé en ${parts})`,
      explain: parts === d ? `${frac(n, d)} : on coupe en ${d} parts et on en prend ${n}.` : `${frac(n, d)} = ${frac(need, parts)} : des parts ${parts / d} fois plus petites, donc ${parts / d} fois plus de parts. Il fallait colorer ${need} parts.` };
  }
  if (l === 4) {
    let a, b, c, d2, why;
    const t = pick(['sameD', 'sameN', 'mult']);
    if (t === 'sameD') { d2 = b = rnd(4, 12); a = rnd(1, b - 1); c = rnd(1, b - 1); why = `Les parts ont la même taille, on compare juste le nombre de parts : ${a} et ${c}.`; }
    else if (t === 'sameN') { a = c = rnd(1, 5); b = rnd(a + 1, 12); do { d2 = rnd(a + 1, 12); } while (d2 === b); why = `On prend ${a} parts dans les deux cas. Plus on coupe en beaucoup de parts, plus chaque part est petite.`; }
    else { const base = pick([2, 3, 4, 5, 6]); b = base; d2 = base * 2; a = rnd(1, b - 1); c = rnd(1, d2 - 1); why = `${frac(a, b)} = ${frac(2 * a, d2)}. On compare ${frac(2 * a, d2)} et ${frac(c, d2)}.`; }
    const x = a / b, y = c / d2, sym = Math.abs(x - y) < 1e-9 ? '=' : x < y ? '<' : '>';
    return { kind: 'compare', fr: [[a, b], [c, d2]], ask: 'Quel signe faut-il mettre ?', prompt: `${frac(a, b)} <span class="slot">?</span> ${frac(c, d2)}`, answer: sym, answerText: sym,
      log: `comparer ${a}/${b} et ${c}/${d2}`, explain: `${why} Donc ${frac(a, b)} ${sym} ${frac(c, d2)}.`,
      choices: ['<', '=', '>'].map(s => ({ v: s, html: s })) };
  }
  const d = pick([6, 8, 10, 12]);
  const who = shuffle(['le mousse', 'le perroquet', 'le capitaine', 'la vigie']).slice(0, 2);
  const a = rnd(1, Math.floor(d / 3)), b = rnd(1, Math.floor(d / 3)), rest = d - a - b;
  const wrong = [...new Set([a + b, rest + 1, rest - 1].filter(x => x > 0 && x < d && x !== rest))].slice(0, 2);
  return { kind: 'choices', scene: 'cake', d, ask: `Gâteau coupé en ${d} parts. ${who[0][0].toUpperCase() + who[0].slice(1)} mange ${frac(a, d)}, ${who[1]} mange ${frac(b, d)}. Quelle fraction reste-t-il ?`, prompt: '',
    answer: rest, answerText: `${rest}/${d}`, log: `${d}/${d} − ${a}/${d} − ${b}/${d}`,
    explain: `${frac(a, d)} + ${frac(b, d)} = ${frac(a + b, d)}. Le gâteau entier, c’est ${frac(d, d)}. Il reste ${frac(d, d)} − ${frac(a + b, d)} = ${frac(rest, d)}.`,
    choices: shuffle([rest, ...wrong]).map(x => ({ v: x, html: frac(x, d) })) };
}

/* ---------- Manche ---------- */
const N_Q = 6;
let R = null, sessionMs = 0, extraMs = 0, tab = 'map';
const sessionOver = () => S.limit > 0 && sessionMs >= S.limit * 60000 + extraMs;
const layer = $('#layer');

function startRound(id) {
  if (sessionOver()) return portModal();
  const g = gameById(id);
  R = { g, lvl: G(id).lvl, i: 0, ok: 0, gold: 0, res: [], seen: new Set(), goldBefore: S.gold };
  ac(); nextQ();
}
function nextQ() {
  if (R.i >= N_Q) return endRound();
  let q, tries = 0;
  do { q = R.g.gen(R.lvl); tries++; } while (R.seen.has(q.log) && tries < 20);
  R.seen.add(q.log); R.q = q; R.input = ''; R.locked = false; R.qt = performance.now();
  R.counts = R.tray = R.sel = R.pick = R.goalZone = null;

}
function renderGame() {
  const { g, q } = R;
  const dots = range(0, N_Q - 1).map(i => `<span class="dot ${i < R.res.length ? (R.res[i] ? 'ok' : 'ko') : i === R.i ? 'cur' : ''}"></span>`).join('');
  layer.innerHTML = `<div class="game waves" style="--gc:${g.color}" role="dialog" aria-label="${esc(g.game)}">
    <div class="g-top"><button class="icon-btn" data-a="quit" aria-label="Quitter la manche">✕</button><div class="dots" aria-label="Question ${R.i + 1} sur ${N_Q}">${dots}</div><span class="lvl-chip">Niv. ${R.lvl}</span></div>
    <div class="g-name">${g.icon} ${g.game}</div>
    <div class="g-body" id="gbody"></div></div>`;
  VIEW[q.kind](q, $('#gbody'));
}

const keypadHTML = () => `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-a="key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-a="key" data-k="del" aria-label="Effacer">⌫</button><button class="key" data-a="key" data-k="0">0</button><button class="key ok" data-a="key" data-k="ok" aria-label="Valider">OK</button></div>`;
const choicesHTML = q => `<div class="choices">${q.choices.map((c, i) => `<button class="choice" data-a="choice" data-i="${i}">${c.html}</button>`).join('')}</div>`;
const pileHTML = (k, n) => Array.from({ length: Math.min(n, 19) }, () => `<i class="blk ${['b-m', 'b-c', 'b-d', 'b-u'][k]}"></i>`).join('');
const COLS = ['Milliers', 'Centaines', 'Dizaines', 'Unités'];

function lineSVG(q, mark, arrow) {
  const x = i => 30 + i * 28;
  let s = `<line x1="${x(0) - 14}" y1="56" x2="${x(10) + 14}" y2="56" stroke="#1d1a2b" stroke-width="4" stroke-linecap="round"/>`;
  for (let i = 0; i <= 10; i++) {
    const big = i === 0 || i === 10 || i === 5;
    s += `<line x1="${x(i)}" y1="${big ? 44 : 48}" x2="${x(i)}" y2="${big ? 68 : 64}" stroke="#1d1a2b" stroke-width="${big ? 3.5 : 2.5}"/>`;
    if (i === 0 || i === 10 || (q.mid && i === 5)) s += `<text x="${x(i)}" y="88" font-size="15" text-anchor="middle">${fmt(q.start + i * q.step)}</text>`;
  }
  if (arrow != null) s += `<text x="${x(arrow)}" y="34" font-size="26" text-anchor="middle" fill="#e8433a">▼</text>`;
  if (mark != null) s += `<text x="${x(mark)}" y="38" font-size="28" text-anchor="middle">${q.mon}</text>`;
  return `<svg class="line-svg" id="line" viewBox="0 0 340 96" role="img" aria-label="Droite graduée de ${fmt(q.start)} à ${fmt(q.start + 10 * q.step)}">${s}</svg>`;
}
function pizzaSVG(parts, sel) {
  const cx = 100, cy = 100, r = 86; let s = '';
  for (let i = 0; i < parts; i++) {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / parts, a1 = a0 + 2 * Math.PI / parts;
    const p = (a) => `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
    s += `<path data-a="slice" data-i="${i}" class="slice${sel.has(i) ? ' on' : ''}" d="M${cx},${cy} L${p(a0)} A${r},${r} 0 0 1 ${p(a1)} Z"/>`;
  }
  return `<svg class="pizza" viewBox="0 0 200 200" role="img" aria-label="Pizza coupée en ${parts} parts"><circle cx="100" cy="100" r="96" fill="#d9a05b" stroke="#1d1a2b" stroke-width="4"/>${s}</svg>`;
}
const barHTML = (n, d) => `<div class="fbar"><span class="lab">${frac(n, d)}</span><span class="cells">${range(1, d).map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span></div>`;

const VIEW = {

      ${q.showTotal ? `<div class="mine-total" style="text-align:center;color:#fff">Tes blocs font : <b>${fmt(val)}</b></div>` : ''}
      <button class="btn green" data-a="validate">Valider</button>`;
  },

      <div class="purse">${q.denoms.map(c => piece(c, 'button', `data-a="pay" data-c="${c}" aria-label="Poser ${coinLabel(c)}"`)).join('')}</div>
      <button class="btn green" data-a="validate" ${R.tray.length ? '' : 'disabled'}>Payer</button>`;

  },

function check(given) {
  const q = R.q;
  switch (q.kind) {
    case 'keypad': case 'mineRead': return [parseInt(R.input, 10) === q.answer, fmt(R.input || '—')];
    case 'mine': { const c = R.counts, v = c[0] * 1000 + c[1] * 100 + c[2] * 10 + c[3]; return [v === q.target, `${fmt(v)} (${c.join('/')})`]; }
    case 'line': return [R.pick === q.k, fmt(q.start + R.pick * q.step)];
    case 'money': { const s = R.tray.reduce((a, b) => a + b, 0); return [s === q.target, fmtE(s)]; }
    case 'pizza': return [R.sel.size * q.d === q.n * q.parts, `${R.sel.size} parts sur ${q.parts}`];
    default: return [given.v === q.answer, typeof given.v === 'number' && q.kind === 'choices' ? `${given.v}/${q.d}` : String(given.v)];
  }
}

function answer(ok, givenText) {
  if (R.locked) return; R.locked = true;
  const ms = Math.min(30000, performance.now() - R.qt), st = G(R.g.id);
  st.tot++; st.ms += ms; if (ok) st.ok++;
  R.res.push(ok);
  if (ok) {
    R.ok++; const fast = ms < 8000, gain = 5 * R.lvl + (fast ? 5 : 0);
    R.gold += gain; S.gold += gain; save();
    celebrate(fast, gain);
    setTimeout(() => { R.i++; nextQ(); }, 1250);
  } else {
    SND.ko();
    S.errors.unshift({ t: Date.now(), g: R.g.id, q: R.q.log, a: givenText, c: R.q.answerText }); S.errors = S.errors.slice(0, 40); save();
    const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'alertdialog');
    sh.innerHTML = `<h2>Presque !</h2><div class="good">La bonne réponse : <span style="color:var(--green)">${esc(R.q.answerText)}</span></div><p class="why">${R.q.explain}</p><button class="btn" data-a="next">J’ai compris ➜</button>`;
    $('.game').appendChild(sh); $('[data-a="next"]', sh).focus();
  }
}
function celebrate(fast, gain) {
  SND.ok();
  const k = R.q.kind;
  if (R.g.id === 'canon') { const b = $('#ball'), f = $('#foe'); if (b) { b.classList.add('fly'); setTimeout(() => { SND.boom(); f && f.classList.add('hit'); f && (f.textContent = '💥'); }, 520); } }
  if (k === 'goal') { const z = R.goalZone ?? 1; const kp = $('#keeper'), bf = $('#ballf'); const dx = [-34, 0, 34][z]; if (bf) { bf.style.left = `${50 + dx}%`; bf.style.bottom = z === 1 ? '62%' : '48%'; } if (kp) kp.style.transform = `translateX(calc(-50% + ${z === 0 ? 120 : -120}%)) rotate(${z === 0 ? 40 : -40}deg)`; }
  if (R.g.id === 'marche') SND.coin();
  const b = document.createElement('div'); b.className = 'burst'; b.setAttribute('aria-live', 'polite');
  b.innerHTML = `<span class="w">${pick(R.g.sfx)}</span><span class="g">+${gain} pièces${fast ? ' ⚡' : ''}</span>`;

}

function endRound() {
  const st = G(R.g.id), before = R.lvl;
  st.rounds++; S.rounds++;
  const stars = R.ok >= 6 ? 3 : R.ok >= 4 ? 2 : R.ok >= 2 ? 1 : 0;
  let lvl = before; if (R.ok >= 5 && lvl < 5) lvl++; else if (R.ok <= 2 && lvl > 1) lvl--;
  st.lvl = lvl;
  const bonus = stars * 10; S.gold += bonus; R.gold += bonus;
  let mon = null;
  if (stars >= 2) {
    const maxL = Math.max(...GAMES.map(g => G(g.id).lvl));
    const pool = CREW.map((c, i) => ({ ...c, i })).filter(c => !S.crew.includes(c.i) && (c.r === 'commune' || (c.r === 'rare' && maxL >= 3) || (c.r === 'légendaire' && maxL >= 4 && stars === 3)));
    if (pool.length) { mon = pick(pool); S.crew.push(mon.i); }
  }
  const rankUp = rankIdx(S.gold) > rankIdx(R.goldBefore) ? RANKS[rankIdx(S.gold)][1] : null;
  save(); SND.fanfare(); renderTop();
  const over = sessionOver();
  const lvlMsg = lvl > before ? `<div class="reward"><span class="e">⬆️</span><span><b>Niveau ${lvl} débloqué !</b>Les questions deviennent plus corsées.</span></div>`
    : lvl < before ? `<div class="reward"><span class="e">🧭</span><span><b>On revient au niveau ${lvl}</b>pour s’entraîner encore un peu.</span></div>` : '';
  layer.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-label="Fin de la manche">
    <h2>${stars === 3 ? 'Escale parfaite !' : stars >= 2 ? 'Belle escale !' : 'Escale terminée'}</h2>

    <div class="chip" style="align-self:center;font-size:24px">🪙 +${R.gold} pièces d’or</div>

    ${mon ? `<div class="reward"><span class="e">${mon.e}</span><span><b>${mon.n} rejoint l’équipage !</b>Créature ${mon.r}.</span></div>` : stars < 2 ? `<p class="muted">Gagne 2 étoiles pour recruter une créature.</p>` : ''}
    ${over ? `<div class="reward" style="background:#dff1ff"><span class="e">⚓</span><span><b>Le navire rentre au port.</b>${S.limit} minutes de navigation : bravo ! On repart demain.</span></div>` : ''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${over ? '' : `<button class="btn" data-a="replay">Rejouer</button>`}<button class="btn alt" data-a="home">Carte</button></div>
  </div></div>`;
  R.done = true;
}

/* ---------- Navigation & événements ---------- */
function show(t) {
  tab = t; $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  ({ map: renderMap, crew: renderCrew, prime: renderPrime, parent: renderParent })[t]();
  $('#main').scrollTop = 0;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3600); }
function closeLayer() { layer.innerHTML = ''; R = null; renderTop(); show(tab); }

function key(k) {
  if (!R || R.locked) return;
  if (k === 'ok') { if (R.input) { const [ok, g] = check(); answer(ok, g); } return; }
  if (k === 'del') R.input = R.input.slice(0, -1);
  else if (R.input.length < 5) R.input = (R.input + k).replace(/^0+(?=\d)/, '');
  SND.tap(); const s = $('#slot'); if (s) s.textContent = R.input ? fmt(R.input) : '';
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  switch (a) {
    case 'tab': SND.tap(); show(el.dataset.t); break;
    case 'play': SND.tap(); startRound(el.dataset.g); break;
    case 'soon': { const s = SOON[+el.dataset.i]; toast(`Idée à venir : ${s.idea}`); break; }
    case 'sound': S.sound = !S.sound; save(); renderTop(); SND.tap(); break;
    case 'quit': R = null; layer.innerHTML = ''; renderTop(); show(tab); break;
    case 'key': key(el.dataset.k); break;
    case 'choice': {
      if (!R || R.locked) break; const c = R.q.choices[+el.dataset.i];
      if (R.q.kind === 'goal') R.goalZone = +el.dataset.i;
      const [ok, g] = check(c); answer(ok, R.q.kind === 'goal' || R.q.kind === 'lineRead' ? fmt(c.v) : g); break;
    }
    case 'blk': { const k = +el.dataset.k, d = +el.dataset.d; R.counts[k] = Math.max(0, Math.min(19, R.counts[k] + d)); SND.tap(); VIEW.mine(R.q, $('#gbody')); break; }
    case 'pay': if (R.tray.length < 20) { R.tray.push(+el.dataset.c); SND.coin(); VIEW.money(R.q, $('#gbody')); } break;
    case 'untray': R.tray.splice(+el.dataset.i, 1); SND.tap(); VIEW.money(R.q, $('#gbody')); break;
    case 'slice': { const i = +el.dataset.i; R.sel.has(i) ? R.sel.delete(i) : R.sel.add(i); SND.tap(); VIEW.pizza(R.q, $('#gbody')); break; }
    case 'validate': { if (!R || R.locked) break; const [ok, g] = check(); answer(ok, g); break; }
    case 'next': if (R) { R.i++; nextQ(); } break;
    case 'replay': { const id = R.g.id; startRound(id); break; }
    case 'home': case 'close': closeLayer(); break;
    case 'profile': profileModal(false); break;
    case 'sample': sample = el.dataset.v === '1'; renderParent(); break;
    case 'limit': S.limit = +el.dataset.v; save(); renderTop(); renderParent(); break;
    case 'extend': extraMs += 5 * 60000; toast('5 minutes de plus accordées.'); renderTop(); renderParent(); break;
    case 'snd': S.sound = el.dataset.v === '1'; save(); renderTop(); renderParent(); break;
    case 'reset1': $('#reset').innerHTML = `<div class="seg"><button class="btn small red" data-a="reset2">Oui, tout effacer</button><button class="btn small alt" data-a="reset0">Annuler</button></div>`; break;
    case 'reset0': renderParent(); break;
    case 'reset2': S = DEF(); save(); sessionMs = 0; renderTop(); parentOpen = false; show('map'); profileModal(true); break;
    case 'lock': parentOpen = false; sample = false; renderParent(); break;
  }
});

/* Tap sur la droite graduée */
document.addEventListener('pointerup', e => {
  const svg = e.target.closest && e.target.closest('#line'); if (!svg || !R || R.locked || R.q.kind !== 'line') return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * 340;
  R.pick = Math.max(0, Math.min(10, Math.round((vx - 30) / 28))); SND.tap(); VIEW.line(R.q, $('#gbody'));
});

/* Clavier physique */
document.addEventListener('keydown', e => {
  if (!R || R.done) return;
  const sheet = $('.sheet');
  if (sheet) { if (e.key === 'Enter') { e.preventDefault(); $('[data-a="next"]', sheet).click(); } return; }
  const k = R.q.kind;
  if (k === 'keypad' || k === 'mineRead') {
    if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('del'); else if (e.key === 'Enter') { e.preventDefault(); key('ok'); }
  } else if (R.q.choices && /^[1-3]$/.test(e.key)) { const b = $$('[data-a="choice"]')[+e.key - 1]; b && b.click(); }
  else if (e.key === 'Enter') { const v = $('[data-a="validate"]'); if (v && !v.disabled) { e.preventDefault(); v.click(); } }
});

/* Sablier de session : ne compte que pendant les escales */
setInterval(() => {
  if (R && !R.done && !document.hidden) {
    sessionMs += 1000; const d = today(); S.days[d] = (S.days[d] || 0) + 1;
    if (sessionMs % 10000 === 0) save(); updateHourglass();
  }
}, 1000);
window.addEventListener('resize', () => { if (tab === 'map') drawRoute(); });
window.addEventListener('pagehide', save);

renderTop(); show('map');
if (!S.name && !S.rounds) profileModal(true);
window.__archipel = { get R() { return R; }, words, genCanon, genFoot, genMine, genChasse, genMarche, genCuisine };
})();
